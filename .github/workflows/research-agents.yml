name: Research agents

# Runs one research command (/demand, /survey, /trends, /gate, ...) with Claude Code when the founder presses Run on the
# agent board (mugcake.vercel.app/board), and /trends by itself every morning. The board sends only a run id (a
# scheduled run asks the board for one): this workflow asks the board what to run and reports back, proving who it is
# with a GitHub OIDC token, so the repo holds no board secret.
#
# This repo is public and so are these logs: nothing below prints what the agents read or write. Claude runs without
# any GitHub token or the YouTube key in reach; files are saved by a later step. Survey and recipe output goes to the
# board only.
#
# Needs, once: the repository secret CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY), optionally YOUTUBE_API_KEY for
# /trends, and this file on the default branch (GitHub only starts workflow_dispatch and schedule workflows found
# there). Runs work on and save to the branch the site is built from (claude/hopeful-sagan-gd3awd).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id from the agent board
        required: true
      command:
        description: Shown in the run name only; the board says what to run
        required: false
        default: ""
      board_url:
        description: Where the board lives
        required: false
        default: https://mugcake.vercel.app
  schedule:
    - cron: "47 2 * * *"   # /trends every day at 8:17 India time

run-name: Agent run ${{ inputs.command || 'daily /trends' }}

permissions:
  contents: write   # the save step pushes what the agents wrote
  id-token: write   # proves to the board that calls come from this workflow

concurrency:
  group: research-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUN_ID: ${{ inputs.run_id }}
      BOARD_URL: ${{ inputs.board_url || 'https://mugcake.vercel.app' }}
      # A scheduled run starts from the default branch's copy of this file; it still works on the site's branch.
      WORK_BRANCH: ${{ github.event_name == 'schedule' && 'claude/hopeful-sagan-gd3awd' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0
          persist-credentials: false   # no token on disk while the agents run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ask the board what to run
        id: start
        run: python3 scripts/board_report.py started

      - name: Install Claude Code
        if: steps.start.outputs.go == 'true'
        run: npm install --global @anthropic-ai/claude-code@2 --no-fund --no-audit --loglevel=error

      - name: Pull the survey
        if: steps.start.outputs.go == 'true' && steps.start.outputs.needs_survey == 'true'
        run: python3 scripts/board_report.py survey

      - name: Pull today's YouTube numbers
        if: steps.start.outputs.go == 'true' && steps.start.outputs.needs_youtube == 'true'
        continue-on-error: true   # without numbers the agent still works from web search and says what is missing
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          pip install --quiet --disable-pip-version-check pytrends==4.9.2 > /dev/null 2>&1 || echo "pytrends not installed; Google Trends left out."
          python3 scripts/youtube_trends.py --trends

      - name: Run the agents
        id: claude
        if: steps.start.outputs.go == 'true'
        timeout-minutes: 60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo no_key > "$RUNNER_TEMP/agent_error"
            echo "::error::Add the repository secret CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY)."
            exit 1
          fi
          extra=()
          if [ -s "$RUNNER_TEMP/disallowed" ]; then extra+=(--disallowedTools "$(cat "$RUNNER_TEMP/disallowed")"); fi
          # The board's OIDC request env stays out of Claude's reach. Output goes to files, never to this public log.
          set +e
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_RUNTIME_TOKEN \
            claude -p "$(cat "$RUNNER_TEMP/prompt")" \
              --model sonnet \
              --output-format json \
              --permission-mode bypassPermissions \
              --append-system-prompt "$(cat "$RUNNER_TEMP/system")" \
              "${extra[@]}" > "$RUNNER_TEMP/claude.json" 2> "$RUNNER_TEMP/claude.err"
          code=$?
          echo "Claude Code finished with exit code $code."
          exit $code

      - name: Gather the reports
        if: always() && steps.start.outputs.go == 'true'
        run: python3 scripts/board_report.py collect

      - name: Save to the repo
        id: save
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHO: ${{ github.event_name == 'schedule' && 'Daily agent run' || 'Agent run from the board' }}
        run: |
          set -euo pipefail
          command="$(cat "$RUNNER_TEMP/command")"
          # Only what agents are meant to write: data/ and reports/, never survey or formulation files.
          # Survey and recipe runs save nothing but the refreshed agent statuses.
          if [ "$(cat "$RUNNER_TEMP/mode")" = commit ]; then
            paths=(); for p in data reports; do [ -e "$p" ] && paths+=("$p"); done
            [ ${#paths[@]} -eq 0 ] || git add -A -- "${paths[@]}" ':(exclude)data/survey' ':(exclude)data/formulation'
          fi
          git checkout -- . && git clean -fdq   # drop anything else the run changed; staged files stay
          python3 scripts/agent_board.py --out app/src/content/agent-board > /dev/null
          git add app/src/content/agent-board
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$WHO: $command" -m "$RUN_URL"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push -q "$remote" "HEAD:refs/heads/${WORK_BRANCH}"; then
              echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)" > "$RUNNER_TEMP/commit_url"
              echo "Saved."
              exit 0
            fi
            git pull -q --rebase "$remote" "${WORK_BRANCH}" || { git rebase --abort || true; break; }
          done
          echo "::error::Could not push the agents' files."
          exit 1

      - name: Report back to the board
        if: always() && steps.start.outputs.go == 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
        run: python3 scripts/board_report.py finished
